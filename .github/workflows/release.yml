name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m venv venv
          venv\Scripts\pip install -r requirements.txt

      - name: Build exe
        run: build.bat

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build installer
        run: |
          & "$env:ProgramFiles(x86)\NSIS\makensis.exe" installer.nsi
        shell: pwsh

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/UglyPDFSetup-*.exe

  macos-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Fetch and stage macOS binaries (poppler, tesseract, ghostscript)
        run: |
          brew install poppler tesseract ghostscript dylibbundler

          mkdir -p poppler-mac tesseract-mac/tessdata ghostscript-mac

          # Stage the binaries, then use dylibbundler to copy every dylib
          # each one depends on alongside it and rewrite its load paths to
          # @executable_path/libs — makes the folder relocatable so it
          # keeps working on a Mac that doesn't have Homebrew installed.
          # dylibbundler only resolves a dylib via the exact path baked into
          # the binary's load commands; when that doesn't line up with where
          # Homebrew actually put it (e.g. a transitive dep pulled from a
          # different formula's Cellar), it falls back to an interactive
          # "Please specify the directory" prompt that just hangs CI. Passing
          # every relevant formula's lib dir via -s gives it somewhere to
          # search instead of prompting.
          brew_lib="$(brew --prefix)/lib"
          poppler_lib="$(brew --prefix poppler)/lib"
          tesseract_lib="$(brew --prefix tesseract)/lib"
          ghostscript_lib="$(brew --prefix ghostscript)/lib"

          cp "$(brew --prefix poppler)/bin/pdftoppm" poppler-mac/
          cp "$(brew --prefix poppler)/bin/pdftocairo" poppler-mac/
          dylibbundler -od -b \
            -x poppler-mac/pdftoppm \
            -x poppler-mac/pdftocairo \
            -d poppler-mac/libs -p @executable_path/libs/ \
            -s "$poppler_lib" -s "$brew_lib"

          cp "$(brew --prefix tesseract)/bin/tesseract" tesseract-mac/
          cp "$(brew --prefix tesseract)/share/tessdata/eng.traineddata" tesseract-mac/tessdata/
          dylibbundler -od -b \
            -x tesseract-mac/tesseract \
            -d tesseract-mac/libs -p @executable_path/libs/ \
            -s "$tesseract_lib" -s "$brew_lib"

          cp "$(brew --prefix ghostscript)/bin/gs" ghostscript-mac/
          dylibbundler -od -b \
            -x ghostscript-mac/gs \
            -d ghostscript-mac/libs -p @executable_path/libs/ \
            -s "$ghostscript_lib" -s "$brew_lib"

          # gs has no compiled-in prefix once copied out of Cellar, so it
          # can't find its init/font/ICC files on its own — stage them
          # alongside the binary and point GS_LIB at them at runtime
          # (see app/tab_compress.py).
          gs_share_dir="$(brew --prefix ghostscript)/share/ghostscript"
          gs_version="$(ls "$gs_share_dir")"
          cp -R "$gs_share_dir/$gs_version/Resource" ghostscript-mac/Resource
          cp -R "$gs_share_dir/$gs_version/lib" ghostscript-mac/lib

      - name: Generate icon.icns from icon.ico
        run: |
          source venv/bin/activate
          python - <<'PY'
          import os
          from PIL import Image

          img = Image.open("icon.ico").convert("RGBA")
          os.makedirs("icon.iconset", exist_ok=True)
          for size in (16, 32, 64, 128, 256, 512):
              img.resize((size, size), Image.LANCZOS).save(f"icon.iconset/icon_{size}x{size}.png")
              img.resize((size * 2, size * 2), Image.LANCZOS).save(f"icon.iconset/icon_{size}x{size}@2x.png")
          PY
          iconutil -c icns icon.iconset -o icon.icns

      - name: Build app bundle
        run: |
          source venv/bin/activate
          pyinstaller --onedir --windowed --name UglyPDF \
            --icon icon.icns \
            --add-data "poppler-mac:poppler-mac" \
            --add-data "tesseract-mac:tesseract-mac" \
            --add-data "ghostscript-mac:ghostscript-mac" \
            --add-data "app:app" \
            pdf2md_gui.py

      - name: Package .dmg
        run: |
          mkdir -p dist/dmg
          cp -R dist/UglyPDF.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "UglyPDF" \
            -srcfolder dist/dmg \
            -ov -format UDZO \
            dist/UglyPDF.dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/UglyPDF.dmg

  release:
    needs: [windows-build, macos-build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows-installer/*.exe
            artifacts/macos-dmg/*.dmg
